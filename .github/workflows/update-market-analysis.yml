name: Update market analysis

on:
  schedule:
    # A股/港股收盘后：北京时间 16:10（UTC 08:10）
    - cron: "10 8 * * 1-5"
    # 美股收盘后：北京时间次日 06:15（UTC 22:15）
    - cron: "15 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-analysis-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate market snapshot
        run: python update_market_data.py

      - name: Commit updated analysis
        run: |
          git config user.name "horizon-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json DAILY_REPORT_LATEST.md
          if git diff --cached --quiet; then
            echo "No analysis changes to commit"
            exit 0
          fi
          git commit -m "Update market analysis $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
